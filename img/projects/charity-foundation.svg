<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBurgundy1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0a19"/>
      <stop offset="100%" stop-color="#14030a"/>
    </linearGradient>
    <linearGradient id="roseGoldGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4838f"/>
      <stop offset="100%" stop-color="#f7d6de"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBurgundy1)"/>
  
  <!-- Window Header -->
  <rect x="60" y="40" width="680" height="370" rx="10" fill="#240815" stroke="rgba(212,131,143,0.3)" stroke-width="1.5"/>
  <rect x="60" y="40" width="680" height="45" rx="10" fill="#18040d"/>
  <circle cx="90" cy="62" r="6" fill="#e86b7b"/>
  <circle cx="110" cy="62" r="6" fill="#d4838f"/>
  <circle cx="130" cy="62" r="6" fill="#f7d6de"/>
  <text x="160" y="68" fill="#e8d8df" font-family="'Comfortaa', sans-serif" font-size="13">foundation-charity-platform.org</text>

  <!-- Left Sidebar -->
  <rect x="80" y="105" width="160" height="285" rx="6" fill="#19040e"/>
  <circle cx="115" cy="140" r="16" fill="rgba(212,131,143,0.2)"/>
  <path d="M 115 130 C 110 125, 105 130, 115 145 C 125 130, 120 125, 115 130 Z" fill="#d4838f"/>
  <text x="140" y="145" fill="#fff8f0" font-family="'Comfortaa', sans-serif" font-size="14" font-weight="bold">CharityApp</text>
  
  <rect x="100" y="180" width="120" height="14" rx="3" fill="#d4838f" opacity="0.9"/>
  <rect x="100" y="210" width="100" height="12" rx="3" fill="rgba(255,248,240,0.15)"/>
  <rect x="100" y="235" width="110" height="12" rx="3" fill="rgba(255,248,240,0.15)"/>
  <rect x="100" y="260" width="85" height="12" rx="3" fill="rgba(255,248,240,0.15)"/>

  <!-- Main Dashboard Content -->
  <rect x="260" y="105" width="460" height="75" rx="6" fill="#19040e"/>
  <text x="280" y="135" fill="#fff8f0" font-family="'Comfortaa', sans-serif" font-size="16" font-weight="bold">Foundation Charity Dashboard</text>
  <text x="280" y="160" fill="#e8d8df" font-family="'Comfortaa', sans-serif" font-size="12">Managing community relief programs, donations &amp; beneficiaries</text>

  <!-- Metric Cards -->
  <rect x="260" y="195" width="140" height="85" rx="6" fill="#320c1d" stroke="rgba(212,131,143,0.25)"/>
  <text x="280" y="225" fill="#f7d6de" font-family="sans-serif" font-size="12">Total Donors</text>
  <text x="280" y="258" fill="#d4838f" font-family="sans-serif" font-size="22" font-weight="bold">1,420+</text>

  <rect x="420" y="195" width="140" height="85" rx="6" fill="#320c1d" stroke="rgba(212,131,143,0.25)"/>
  <text x="440" y="225" fill="#f7d6de" font-family="sans-serif" font-size="12">Programs</text>
  <text x="440" y="258" fill="#fff8f0" font-family="sans-serif" font-size="22" font-weight="bold">18 Active</text>

  <rect x="580" y="195" width="140" height="85" rx="6" fill="#320c1d" stroke="rgba(212,131,143,0.25)"/>
  <text x="600" y="225" fill="#f7d6de" font-family="sans-serif" font-size="12">Beneficiaries</text>
  <text x="600" y="258" fill="#f7d6de" font-family="sans-serif" font-size="22" font-weight="bold">3,850</text>

  <!-- Chart / Data visualization -->
  <rect x="260" y="295" width="460" height="95" rx="6" fill="#19040e"/>
  <path d="M 285 365 L 340 335 L 400 350 L 460 320 L 520 340 L 580 305 L 680 325" fill="none" stroke="url(#roseGoldGrad1)" stroke-width="3"/>
  <circle cx="680" cy="325" r="5" fill="#d4838f"/>
