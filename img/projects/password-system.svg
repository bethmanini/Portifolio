<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBurgundy2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0a19"/>
      <stop offset="100%" stop-color="#14030a"/>
    </linearGradient>
    <linearGradient id="shieldRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d6de"/>
      <stop offset="100%" stop-color="#d4838f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBurgundy2)"/>

  <!-- Window Frame -->
  <rect x="60" y="40" width="680" height="370" rx="10" fill="#240815" stroke="rgba(212,131,143,0.3)" stroke-width="1.5"/>
  <rect x="60" y="40" width="680" height="45" rx="10" fill="#18040d"/>
  <circle cx="90" cy="62" r="6" fill="#e86b7b"/>
  <circle cx="110" cy="62" r="6" fill="#d4838f"/>
  <circle cx="130" cy="62" r="6" fill="#f7d6de"/>
  <text x="160" y="68" fill="#e8d8df" font-family="'Comfortaa', sans-serif" font-size="13">secure-pass-system.auth // Cryptographic Vault</text>

  <!-- Left Side: Password Form & Generator -->
  <rect x="90" y="110" width="360" height="275" rx="8" fill="#19040e" stroke="rgba(212,131,143,0.2)"/>
  <text x="115" y="145" fill="#fff8f0" font-family="'Comfortaa', sans-serif" font-size="16" font-weight="bold">Credential Security Manager</text>
  
  <!-- Master Password input -->
  <text x="115" y="180" fill="#f7d6de" font-family="sans-serif" font-size="12">Master Password Key</text>
  <rect x="115" y="190" width="310" height="38" rx="4" fill="#320c1d" stroke="#d4838f" stroke-width="1.5"/>
  <circle cx="135" cy="209" r="4" fill="#fff8f0"/>
  <circle cx="150" cy="209" r="4" fill="#fff8f0"/>
  <circle cx="165" cy="209" r="4" fill="#fff8f0"/>
  <circle cx="180" cy="209" r="4" fill="#fff8f0"/>
  <circle cx="195" cy="209" r="4" fill="#fff8f0"/>
  <circle cx="210" cy="209" r="4" fill="#fff8f0"/>
  <circle cx="225" cy="209" r="4" fill="#fff8f0"/>
  <circle cx="240" cy="209" r="4" fill="#fff8f0"/>
  <text x="360" y="213" fill="#f7d6de" font-family="sans-serif" font-size="11" font-weight="bold">STRONG</text>

  <!-- Security Strength Meter -->
  <rect x="115" y="238" width="310" height="6" rx="3" fill="#320c1d"/>
  <rect x="115" y="238" width="280" height="6" rx="3" fill="#d4838f"/>

  <!-- Hash / Salt Display -->
  <rect x="115" y="260" width="310" height="50" rx="4" fill="#1e0510"/>
  <text x="125" y="280" fill="#d4838f" font-family="monospace" font-size="11">SHA-256 [HASH]:</text>
  <text x="125" y="298" fill="#e8d8df" font-family="monospace" font-size="10">e3b0c44298fc1c149afbf4c8996fb92427...</text>

  <!-- Action button -->
  <rect x="115" y="325" width="140" height="38" rx="4" fill="#d4838f"/>
  <text x="145" y="348" fill="#18050d" font-family="'Comfortaa', sans-serif" font-size="12" font-weight="bold">Encrypt &amp; Save</text>

  <!-- Right Side: Big Shield Graphic & Features -->
  <rect x="475" y="110" width="235" height="275" rx="8" fill="#19040e" stroke="rgba(212,131,143,0.2)"/>
  
  <!-- Shield Icon -->
  <path d="M 592 140 L 642 165 C 642 215, 592 245, 592 250 C 592 245, 542 215, 542 165 Z" fill="url(#shieldRose)"/>
  <circle cx="592" cy="185" r="10" fill="#18050d"/>
  <rect x="589" y="185" width="6" height="15" fill="#18050d"/>

  <text x="592" y="280" fill="#fff8f0" font-family="'Comfortaa', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Multi-Factor Vault</text>
  <text x="592" y="305" fill="#e8d8df" font-family="sans-serif" font-size="12" text-anchor="middle">End-to-End Encryption</text>
  <text x="592" y="325" fill="#e8d8df" font-family="sans-serif" font-size="12" text-anchor="middle">Entropy Score Analysis</text>
  <text x="592" y="345" fill="#f7d6de" font-family="sans-serif" font-size="12" text-anchor="middle">✓ Zero Plaintext Storage</text>
</svg>
